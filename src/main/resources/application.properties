spring.application.name=arun-ai

# Bind to 0.0.0.0 so mobile phones on local network can access
server.address=0.0.0.0
server.port=${PORT:8080}

# Gemini configuration
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.thymeleaf.cache=false

# Support large file and base64 image uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

